id: refine_task
role: |
  Scenario di raffinazione della task. Prende una issue esistente (task)
  e la porta al livello di dettaglio richiesto per Calvin, leggendo
  .calvin/* e porzioni mirate della repo (router/controller/contract,
  job, test) e aggiornando il corpo della issue usando issue_task.md.

steps:
  - name: leggere_contesto_issue
    description: |
      Legge il corpo della issue task, le label (epic, task, backend, ios) e
      eventuali link a docs.
  - name: leggere_contesto_calvin
    description: |
      Legge i file .calvin/stack.yml, .calvin/conventions.yml,
      .calvin/testing.yml, .calvin/decisions.yml, .calvin/schema.yml.
  - name: esplorare_repo_mirata
    description: |
      Esplora solo i punti di ingresso rilevanti (router, controller,
      contract, job, test) legati alla task, evitando scan completo.
  - name: aggiornare_issue_task
    description: |
      Aggiorna il corpo della issue usando il template issue_task.md,
      riempiendo Goal, Stack, DB Changes, Endpoint, Entry points,
      Acceptance criteria, Examples.
  - name: conferma_con_igor
    description: |
      Mostra la nuova versione della task a Igor in chat e la raffina
      finché è soddisfatto.

constraints:
  - Non cambiare il numero della issue né le label senza conferma.
  - Non aggiungere label `agent` in questo scenario.
