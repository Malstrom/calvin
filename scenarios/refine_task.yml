id: refine_task
role: |
  Task refinement scenario. Takes an existing task or bug issue and brings
  it to the level of detail required for Calvin to write a precise agent
  prompt. Reads .calvin/* from the TARGET repo and targeted parts of the
  repo codebase, then updates the issue body using templates/issue_task.md.

steps:
  - name: read_issue_context
    description: |
      Read the task or bug issue body, labels (epic, task, bug, backend, ios)
      and any linked docs.

  - name: read_calvin_context
    description: |
      Read ALL .calvin/* files from the TARGET repo (e.g. synca/backend/api/.calvin/):
        - .calvin/stack.yml
        - .calvin/conventions.yml
        - .calvin/testing.yml
        - .calvin/decisions.yml
        - .calvin/schema.yml
      These files are small and act as the authoritative spec — never skim
      or partially read them. Always read them fully before refining the task.

  - name: explore_repo_targeted
    description: |
      Explore the codebase to understand the real implementation state of
      the task or bug. Start from the paths indicated by the issue body and
      .calvin/*, then follow every reference that is relevant: models,
      controllers, services, contracts, serializers, jobs, tests, migrations,
      concerns, fixtures. Do NOT restrict exploration to a fixed list of file
      types. Do NOT stop at the first level — if a controller uses a concern,
      read the concern; if a serializer is referenced, read it.
      The goal is to know enough to identify ALL files that will be touched,
      not to scan the entire repo blindly.

  - name: collect_file_contents
    description: |
      For every file identified as touched in explore_repo_targeted:
        - MODIFIED files: download the full current content. These will appear
          verbatim in the issue under ## Touched files and later in the agent
          prompt under ## Files (REWRITE blocks).
        - NEW test files: write the boilerplate (frozen_string_literal, require,
          class declaration) plus one named empty test per expected behaviour.
          Method names must be self-explanatory in plain English — the name
          alone must communicate what is being asserted without reading the body.
        - EXISTING test files to extend: download the full current content.
      Do not skip any file that will be modified. The agent must never guess
      the current content of a file it is about to change.

  - name: update_issue_task
    description: |
      Update the issue body using templates/issue_task.md (in the Calvin repo),
      filling all relevant fields:
        - Goal, Parent, Stack
        - DB Changes (if any)
        - Endpoint (method, path, auth, request/response shape)
        - Entry points (file paths, class names, route names)
        - Acceptance criteria
        - Dependencies (other issues or PRs)
        - Notes (edge cases, gotchas)
        - Examples (references to existing code to replicate)
        - Touched files: list every file that will be created or modified,
          labelled as NEW or MODIFIED. This becomes the contract for the
          agent_prompt scenario.

  - name: confirm_with_igor
    description: |
      Show the updated issue to Igor in chat and refine until all of the
      following are true before proceeding:
        - [ ] Every file that will be touched is listed under Touched files
        - [ ] Every new test file has at least one named empty test with a
              self-explanatory method name
        - [ ] Acceptance criteria are verifiable (pass/fail, not vague)
        - [ ] DB Changes section is present if and only if a migration is needed
        - [ ] No field is left as a placeholder or [TODO]

constraints:
  - Do not change the issue number or labels without confirmation.
  - Do not add the `agent` label in this scenario.
  - Template to use: templates/issue_task.md (in the Calvin repo).
  - Context source: .calvin/* files in the TARGET repo (read fully), plus
    targeted exploration of app/ code as needed.
