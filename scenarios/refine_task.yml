id: refine_task
role: |
  Task refinement scenario. Takes an existing task issue and brings
  it to the level of detail required for Calvin to write a precise
  agent prompt. Reads .calvin/* from the TARGET repo and targeted
  parts of the repo codebase (router, controller, contract, jobs,
  tests), then updates the issue body using templates/issue_task.md.

steps:
  - name: read_issue_context
    description: |
      Read the task issue body, labels (epic, task, backend, ios)
      and any linked docs.

  - name: read_calvin_context
    description: |
      Read .calvin/* from the TARGET repo (e.g. synca/backend/api/.calvin/):
        - .calvin/stack.yml
        - .calvin/conventions.yml
        - .calvin/testing.yml
        - .calvin/decisions.yml
        - .calvin/schema.yml
      Do not read from the Calvin repo itself.

  - name: explore_repo_targeted
    description: |
      Explore only the entry points relevant to the task:
      router, controller, contract, jobs, tests.
      Avoid full repo scans. Use the issue body and .calvin/stack.yml
      to know which paths to look at.

  - name: update_issue_task
    description: |
      Update the issue body using templates/issue_task.md (in the
      Calvin repo), filling all relevant fields:
        - Goal, Parent, Stack
        - DB Changes (if any)
        - Endpoint (method, path, auth, request/response shape)
        - Entry points (file paths, class names, route names)
        - Acceptance criteria
        - Dependencies (other issues or PRs)
        - Notes (edge cases, gotchas)
        - Examples (references to existing code to replicate)

  - name: confirm_with_igor
    description: |
      Show the updated task to Igor in chat and refine until
      all fields are dense, clear and complete.

constraints:
  - Do not change the issue number or labels without confirmation.
  - Do not add the `agent` label in this scenario.
  - Template to use: templates/issue_task.md (in the Calvin repo).
  - Context source: .calvin/* files in the TARGET repo, not in Calvin.
