id: refine_task
role: |
  Task refinement scenario. Takes a raw issue (goal + intent) and brings it
  to the level of detail required for Calvin to run the develop cycle.

  The issue describes WHAT we want — concrete goal, expected behavior,
  endpoint contract, acceptance criteria.
  The HOW (which files to touch, which patterns to follow, how to structure
  the code) is NOT part of this issue — Calvin derives it from RAG chunks
  and codebase exploration during the develop cycle.

  Templates available (choose based on issue type):
    - templates/issue_endpoint.md  — new or modified HTTP endpoint
    - templates/issue_logic.md     — behavior change without new endpoint
    - templates/issue_job.md       — new or modified delayed job
    - templates/issue_bug.md       — bug fix

steps:
  - name: identify_type
    description: |
      Read the issue title, body, and labels. Determine which of the 4 types
      applies: endpoint, logic, job, bug.
      If ambiguous, ask Igor before proceeding.
      Do not assume — wrong template = wrong issue structure.

  - name: read_issue_context
    description: |
      Read the current issue body and any linked issues or epics referenced
      in the title or body. Understand what Igor wants to achieve.

  - name: fill_template
    description: |
      Fill the appropriate template for the issue type identified in step 1.

      Rules:
        - Every field must be filled. No placeholders, no [TODO], no empty sections.
        - ## Goal: one sentence, concrete and verifiable from the outside.
        - ## Endpoint (endpoint type only): include full request/response shapes
          as JSON. If auth is required, say so explicitly.
        - ## Behavior (logic type only): Before/After must describe observable
          behavior, not implementation. "Before: returns 200 with empty array.
          After: returns 422 with error code X" is good.
          "Before: does not call ServiceX" is bad — not observable from outside.
        - ## Job (job type only): idempotency and failure behavior are mandatory.
          If unclear, ask Igor.
        - ## Reproduction (bug type only): steps must be specific enough that
          Calvin can write a failing test that reproduces the bug.
        - ## Acceptance criteria: observable outcomes only. Not "uses monad",
          not "follows convention X" — those come from RAG chunks automatically.
          Each criterion must be independently verifiable as pass/fail.
        - ## DB Changes (endpoint type only): include only if a migration or
          model change is needed. If none, write "none".
        - ## Notes: include only business constraints, edge cases, or domain
          knowledge that Calvin cannot infer from code or chunks. If nothing
          relevant, omit the section entirely.
        - Do NOT add: Entry points, Touched files, Examples, Dependencies.
          Calvin derives all of that during the develop cycle.

  - name: confirm_with_igor
    description: |
      Show the filled issue to Igor in chat before updating the issue body.
      Refine until all of the following are true:
        - [ ] Template type matches the actual intent of the issue
        - [ ] ## Goal is one sentence, verifiable from the outside
        - [ ] All mandatory fields for the template type are filled
        - [ ] ## Acceptance criteria are pass/fail, not implementation details
        - [ ] No field contains a placeholder or [TODO]
        - [ ] ## Notes is present only if it contains real constraints

  - name: update_issue
    description: |
      Update the issue body with the confirmed template content.
      Do NOT change: issue number, title, labels.
      Do NOT add the `calvin` or `agent` label — Igor does that manually
      after reviewing the final issue body.

constraints:
  - Choose the template based on issue type — never mix sections from multiple templates.
  - The issue body describes WHAT, never HOW.
  - All fields mandatory for the chosen template type — no exceptions.
  - Templates location: templates/ in the Calvin repo.
