id: refine_task
role: |
  Task refinement scenario. Takes an existing task or bug issue and brings
  it to the level of detail required for Calvin to write a precise agent
  prompt. Reads .calvin/* from the TARGET repo and targeted parts of the
  repo codebase, then updates the issue body using templates/issue_task.md.

steps:
  - name: read_issue_context
    description: |
      Read the task or bug issue body, labels (epic, task, bug, backend, ios)
      and any linked docs.

  - name: read_calvin_context
    description: |
      Read ALL .calvin/* files from the TARGET repo (e.g. synca/backend/api/.calvin/):
        - .calvin/stack.yml
        - .calvin/conventions.yml
        - .calvin/testing.yml
        - .calvin/decisions.yml
        - .calvin/schema.yml
      These files are small and act as the authoritative spec — never skim
      or partially read them. Always read them fully before refining the task.

  - name: explore_repo_targeted
    description: |
      Explore the codebase to understand the real implementation state of
      the task or bug, not just the spec. Start from the paths indicated by
      the issue body and .calvin/*, then follow references (models, controllers,
      services, contracts, serializers, jobs, tests, migrations) as needed.
      Do NOT restrict exploration to a fixed list like router/controllers only.
      The goal is to know enough to refine the issue accurately, not to scan
      the entire repo blindly.

  - name: update_issue_task
    description: |
      Update the issue body using templates/issue_task.md (in the
      Calvin repo), filling all relevant fields:
        - Goal, Parent, Stack
        - DB Changes (if any)
        - Endpoint (method, path, auth, request/response shape)
        - Entry points (file paths, class names, route names)
        - Acceptance criteria
        - Dependencies (other issues or PRs)
        - Notes (edge cases, gotchas)
        - Examples (references to existing code to replicate)

  - name: confirm_with_igor
    description: |
      Show the updated task to Igor in chat and refine until
      all fields are dense, clear and complete.

constraints:
  - Do not change the issue number or labels without confirmation.
  - Do not add the `agent` label in this scenario.
  - Template to use: templates/issue_task.md (in the Calvin repo).
  - Context source: .calvin/* files in the TARGET repo (read fully), plus
    targeted exploration of app/ code as needed.
