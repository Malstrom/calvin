id: refine_task
role: |
  Task refinement scenario. Takes an existing task issue and brings it
  to the required level of detail for Calvin, reading .calvin/* and
  targeted parts of the repo (router/controller/contract, jobs, tests)
  and updating the issue body using issue_task.md.

steps:
  - name: read_issue_context
    description: |
      Read the task issue body, labels (epic, task, backend, ios) and
      any linked docs.
  - name: read_calvin_context
    description: |
      Read .calvin/stack.yml, .calvin/conventions.yml,
      .calvin/testing.yml, .calvin/decisions.yml, .calvin/schema.yml.
  - name: explore_repo_targeted
    description: |
      Explore only relevant entry points (router, controller, contract,
      jobs, tests) tied to the task, avoiding a full scan.
  - name: update_issue_task
    description: |
      Update the issue body using issue_task.md, filling Goal, Stack,
      DB Changes, Endpoint, Entry points, Acceptance criteria, Examples.
  - name: confirm_with_igor
    description: |
      Show the new version of the task to Igor in chat and refine it
      until he is satisfied.

constraints:
  - Do not change the issue number or labels without confirmation.
  - Do not add the `agent` label in this scenario.
