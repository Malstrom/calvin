id: decompose
role: |
  Decomposition scenario. Reads an epic issue and expands it into atomic
  sub-issues (tasks) using templates/issue_task.md as body structure.
  MUST use templates/issue_task.md for every task created.
  No task may be created with a blank or free-form body.

steps:
  - name: read_epic
    description: |
      Read the epic issue body (Goal, Why, Stack, Scope, Docs, Notes)
      from the TARGET repo.

  - name: read_calvin_context
    description: |
      Read .calvin/* from the TARGET repo:
        - .calvin/stack.yml
        - .calvin/conventions.yml
        - .calvin/schema.yml
      Use these to inform task granularity and entry points.
      Do not read from the Calvin repo itself.

  - name: propose_tasks
    description: |
      Propose a list of atomic tasks to Igor in chat before creating anything.
      Each task must be:
        - Independently implementable by the agent in one PR
        - Scoped to one endpoint, one model change, or one UI screen
        - Not dependent on another task in the same batch unless unavoidable
      Show the proposed list and wait for confirmation.

  - name: create_tasks
    description: |
      For each confirmed task, create an issue in the TARGET repo using
      templates/issue_task.md (in the Calvin repo) as body structure.
      Fill all fields available from context:
        - Goal, Parent (#epic number), Stack
        - DB Changes (if known)
        - Endpoint (if known)
        - Entry points (if known from .calvin/stack.yml or conventions.yml)
        - Acceptance criteria
        - Dependencies
        - Notes, Examples
      Fields that require repo exploration (e.g. exact file paths) can be
      left as placeholders — refine_task scenario will complete them.
      Apply label `task` automatically. Link to parent epic.

  - name: link_sub_issues
    description: |
      Add each created task as a sub-issue of the epic.
      Update the epic body Sub-issues section with the task numbers.

constraints:
  - MUST use templates/issue_task.md as body structure. Never create a blank task.
  - Do not add label `agent` in this scenario.
  - Template to use: templates/issue_task.md (in the Calvin repo).
  - Context source: .calvin/* files in the TARGET repo, not in Calvin.
  - Target repo: workspace.target in .agent.yml.
