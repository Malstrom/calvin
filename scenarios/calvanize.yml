id: calvanize
on:
  - user wants to bootstrap Calvin on a new repo
  - user says calvanize or inizializza calvin
  - .calvin/ does not exist on target repo
preconditions: any

role: |
  Collega Calvin a un repo Rails creando `.calvin/` nel repo target.

  Il motore legge esattamente due file, e nessun altro:
    .calvin/project.yml     layout, comandi test, gate, forbidden_patterns
    .calvin/conventions.md  le regole sempre attive, iniettate nel system prompt

  Riferimento: templates/calvin/project.yml, templates/calvin/conventions.md
  Guida completa: docs/targeting-a-new-repo.md

  I sorgenti di Calvin non vengono copiati nel target: il motore gira via workflow_call
  da Malstrom/calvin.

reads:
  - instance:github:repo:default_branch
  - instance:codebase:sample_files

states:
  check_existing:
    condition: .calvin/ exists on target repo
    on_true:
      action: warn
      message: .calvin/ already present in {{target_repo}}. Continuing will overwrite existing files.
      next: confirm_overwrite
    on_false:
      next: read_codebase

  confirm_overwrite:
    action: confirm
    message: overwrite existing .calvin/?
    on_confirm:
      next: read_codebase
    on_reject:
      next: stop

  read_codebase:
    action: sample_codebase
    paths: [Gemfile, config/routes.rb, app/, lib/, test/, spec/]
    note: |
      Leggere abbastanza da dedurre, senza chiedere:
        - app_root: dov'è config/application.rb rispetto alla radice del repo
        - test.framework e test.command: presenza di test/ o spec/, gem rspec nel Gemfile
        - test.path_map: come sono nominati i file di test esistenti
        - i layer reali dell'app (app/services, app/contracts, …) per le convenzioni
        - pattern ricorrenti candidati a forbidden_patterns
    next: draft_context

  draft_context:
    action: output
    format: |
      Proposta `.calvin/` per {{target_repo}}:

      **.calvin/project.yml**
      {{proposed_project}}

      **.calvin/conventions.md**
      {{proposed_conventions}}

      **.github/workflows/calvin.yml**
      {{proposed_workflow}}
    note: |
      Dedurre dal codice, mai placeholder generici.

      Su project.yml: omettere le chiavi che coincidono col default (app in root, minitest,
      bin/rails test). Un profilo corto è un profilo giusto.

      Su conventions.md: solo regole SEMPRE valide, e solo se osservate davvero nel codice.
      Una regola verificabile a macchina non va qui: va in forbidden_patterns.
      Budget 8 KB — puntare a 10-20 regole, non a un manuale.
    next: confirm_context

  confirm_context:
    action: confirm
    message: sono corretti? modifica prima di procedere
    on_confirm:
      next: write_files
    on_changes:
      next: draft_context

  write_files:
    action: github_push_files
    branch: calvin/bootstrap
    files:
      - path: .calvin/project.yml
        content: proposed_project
      - path: .calvin/conventions.md
        content: proposed_conventions
      - path: .github/workflows/calvin.yml
        content: proposed_workflow
    commit_message: "calvin: bootstrap .calvin/ via calvanize"
    next: open_pr

  open_pr:
    action: github_create_pr
    title: "calvin: bootstrap .calvin/"
    body: |
      Collega Calvin a {{target_repo}}.

      - `.calvin/project.yml` — layout, comandi test, gate, pattern vietati
      - `.calvin/conventions.md` — regole sempre attive, iniettate nel system prompt
      - `.github/workflows/calvin.yml` — trigger sulla label `calvin`

      Il motore resta in Malstrom/calvin ed è invocato via `workflow_call`.

      Dopo il merge servono: le label `calvin` e `calvin:red`, e i secret
      `GH_TOKEN` e `MISTRAL_API_KEY`.

      Generato dallo scenario `calvanize`.
    next: done

  done:
    action: output
    message: |
      PR aperta: calvin/bootstrap su {{target_repo}}.
      Dopo il merge, crea le label `calvin` e `calvin:red` e i secret, poi metti la label
      `calvin` su una issue per il primo run.

constraints:
  - Il motore legge SOLO .calvin/project.yml e .calvin/conventions.md — non inventare altri file.
  - Mai copiare i sorgenti di Calvin nel repo target.
  - Omettere dal project.yml ogni chiave che coincide col default.
  - Una regola verificabile deterministicamente va in forbidden_patterns, non in conventions.md.
