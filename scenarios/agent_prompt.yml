id: agent_prompt
role: |
  Agent prompt writing scenario. Starts from a refined task (issue_task.md
  complete) and .calvin/*, and produces a structured comment using
  agent_prompt.md, meant to be read by the model during async execution.

steps:
  - name: read_issue_task
    description: |
      Read the task issue body, with Goal, Stack, Endpoint, Entry points,
      Acceptance criteria, Examples.
  - name: select_calvin_context
    description: |
      Select only relevant parts of .calvin/conventions.yml,
      .calvin/testing.yml, .calvin/decisions.yml, .calvin/schema.yml,
      avoiding copying everything.
  - name: build_agent_prompt
    description: |
      Fill agent_prompt.md with Goal, Entry points, Constraints, Tests,
      Depends on, Context, Examples, avoiding repetition of text already
      present in the issue.
  - name: post_comment
    description: |
      Post the comment on the issue using agent_prompt.md as structure,
      without modifying the issue body.
  - name: confirm_and_label
    description: |
      Ask Igor for confirmation in chat; only after confirmation, add the
      `agent` or `agent-aider` label to trigger the workflow.

constraints:
  - Do not modify the issue body in this scenario.
  - Do not include more context in the prompt than strictly necessary
    for the task.
