id: agent_prompt
role: |
  Agent prompt writing scenario. Starts from a refined task or bug issue
  (filled with templates/issue_task.md) and the .calvin/* files from the
  target repo, and produces a structured comment posted on the issue using
  templates/agent_prompt.md as schema.
  The comment must be as dense as possible (no wasted tokens) but also as
  descriptive as possible so the model can implement the task without guessing.
  It must never duplicate content already present in the issue body.

steps:
  - name: read_issue_task
    description: |
      Read the task or bug issue body (written using templates/issue_task.md).
      Note which fields are already filled: Goal, Stack, Endpoint,
      Entry points, Acceptance criteria, Examples. These must NOT be
      repeated verbatim in the agent prompt comment.

  - name: read_calvin_context
    description: |
      Read ALL .calvin/* files from the TARGET repo (e.g. synca/backend/api/.calvin/):
        - .calvin/conventions.yml
        - .calvin/testing.yml
        - .calvin/decisions.yml
        - .calvin/schema.yml
        - .calvin/stack.yml
      These files are small and act as the authoritative spec — never skim
      or partially read them. Always read them fully before writing the prompt.

  - name: build_agent_prompt
    description: |
      Fill templates/agent_prompt.md with:
        - Goal: one concrete sentence, not a copy of the issue Goal
          unless it is already maximally dense.
        - Entry points: max 5 files/class/route strictly needed.
          If more are needed, the task is too wide.
        - Constraints: only the rules from .calvin/conventions.yml
          and .calvin/decisions.yml relevant to this task (not the full files).
        - Tests: what to test and how, from .calvin/testing.yml,
          specific to this task.
        - Depends on: issue or PR numbers to respect.
        - Context: only information NOT already in the issue body
          but critical to avoid mistakes (e.g. enum + migration pairing,
          testing mandate, fixture_enum_rule).
        - Examples: precise references to existing code (controller,
          contract, job, test, migration) with a short summary of what must be
          replicated. Never paste full code blocks.
      Density rule: if a sentence can be cut without losing information
      needed to implement the task, cut it.
      Language rule: the entire prompt MUST be written in English.
      This is mandatory — no exceptions regardless of chat language.

  - name: post_comment
    description: |
      Post the filled agent_prompt.md as a comment on the issue.
      Do NOT modify the issue body.

  - name: confirm_and_label
    description: |
      Show the comment to Igor in chat for a final check.
      Only after explicit confirmation, add label `agent` or
      `agent-aider` to trigger the GitHub Actions workflow.

constraints:
  - Do not modify the issue body in this scenario.
  - Do not include in the prompt more context than strictly needed.
  - Never copy entire .calvin/* files into the comment.
  - Never repeat content already present verbatim in the issue body.
  - The agent prompt MUST be written entirely in English — mandatory, no exceptions.
  - Template to use: templates/agent_prompt.md (in the Calvin repo).
  - Context source: .calvin/* files in the TARGET repo (read fully), not in Calvin.
