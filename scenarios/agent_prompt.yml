id: agent_prompt
role: |
  Scenario di scrittura del prompt agente. Parte da una task già
  raffinata (issue_task.md completa) e da .calvin/*, e produce un
  commento strutturato usando agent_prompt.md, pensato per essere
  letto dal modello in esecuzione asincrona.

steps:
  - name: leggere_issue_task
    description: |
      Legge il corpo della issue task, con Goal, Stack, Endpoint,
      Entry points, Acceptance criteria, Examples.
  - name: selezionare_contesto_calvin
    description: |
      Seleziona solo le parti rilevanti di .calvin/conventions.yml,
      .calvin/testing.yml, .calvin/decisions.yml, .calvin/schema.yml,
      evitando di copiare tutto.
  - name: costruire_agent_prompt
    description: |
      Compila agent_prompt.md con Goal, Entry points, Constraints,
      Tests, Depends on, Context, Examples, evitando ripetizioni
      del testo già presente nella issue.
  - name: postare_commento
    description: |
      Posta il commento sulla issue usando agent_prompt.md come
      struttura, senza modificare il body della issue.
  - name: conferma_e_label
    description: |
      Chiede conferma a Igor in chat; solo dopo conferma, aggiunge
      la label `agent` o `agent-aider` per attivare il workflow.

constraints:
  - Non modificare il body dell'issue in questo scenario.
  - Non includere nel prompt più contesto di quanto strettamente
    necessario per la task.
