id: agent_prompt
role: |
  Agent prompt writing scenario. Starts from a refined task or bug issue
  (filled with templates/issue_task.md) and the .calvin/* files from the
  target repo, and produces a structured comment posted on the issue using
  templates/agent_prompt.md as schema.
  The comment must be as dense as possible (no wasted tokens) but also as
  complete as possible so the model can implement the task without guessing.
  It must never duplicate content already present in the issue body.

steps:
  - name: read_issue_task
    description: |
      Read the task or bug issue body (written using templates/issue_task.md).
      Note which fields are already filled: Goal, Stack, Endpoint,
      Entry points, Acceptance criteria, Touched files, Examples.
      These must NOT be repeated verbatim in the agent prompt comment.

  - name: read_calvin_context
    description: |
      Read ALL .calvin/* files from the TARGET repo:
        - .calvin/conventions.yml
        - .calvin/testing.yml
        - .calvin/decisions.yml
        - .calvin/schema.yml
        - .calvin/stack.yml
      These files are small and act as the authoritative spec — never skim
      or partially read them. Always read them fully before writing the prompt.

  - name: collect_file_contents
    description: |
      For every file listed under "Touched files" in the issue body:
        - MODIFIED: download the full current content — it will appear in the
          prompt as a REWRITE block. Never write a REWRITE block without the
          actual current content.
        - NEW test file: write the boilerplate (frozen_string_literal, require,
          class declaration) plus one named empty test per expected behaviour
          from the issue. Method names must be self-explanatory in plain English.
        - Reference-only file: download the full current content — it will appear
          as a READ-ONLY block.
      Do not skip any file. The agent must never guess what a file currently
      contains if it is going to change it.

  - name: build_agent_prompt
    description: |
      Fill templates/agent_prompt.md with:
        - Goal: one concrete sentence, only if it adds precision beyond the
          issue Goal. Do not copy the issue Goal verbatim unless it is already
          maximally dense.
        - Constraints: only the rules from .calvin/conventions.yml and
          decisions.yml relevant to this specific task (not the full files).
        - Tests: for each test, write the exact method name in plain English +
          one line describing what it asserts. Match the names from the boilerplate
          written in collect_file_contents.
        - Context: only information NOT already in the issue body but critical
          to avoid mistakes (enum + migration pairing, fixture_enum_rule,
          Zeitwerk rules, timestamp format, etc.).
        - Files: one block per touched file using REWRITE/CREATE/READ-ONLY labels.
          REWRITE blocks contain the full current content.
          CREATE blocks contain the boilerplate with named empty tests.
          READ-ONLY blocks contain the full current content for context.
        - Expected output: exhaustive list of files the commit must contain,
          each labelled as new or modified. The agent uses this as a self-check.
      Density rule: if a sentence can be cut without losing information needed
      to implement the task, cut it.
      Language rule: the entire prompt MUST be written in English — mandatory,
      no exceptions regardless of chat language.

  - name: post_comment
    description: |
      Post the filled agent_prompt.md as a comment on the issue.
      Do NOT modify the issue body.

  - name: confirm_and_label
    description: |
      Show the comment to Igor in chat for a final check.
      Only after explicit confirmation, add label `agent` or
      `agent-aider` to trigger the GitHub Actions workflow.

constraints:
  - Do not modify the issue body in this scenario.
  - Never write a REWRITE block without the actual current file content.
  - Never write a CREATE block without at least one named empty test.
  - Never include more context than strictly needed to implement the task.
  - Never copy entire .calvin/* files into the comment.
  - Never repeat content already present verbatim in the issue body.
  - The agent prompt MUST be written entirely in English — mandatory, no exceptions.
  - Template to use: templates/agent_prompt.md (in the Calvin repo).
  - Context source: .calvin/* files in the TARGET repo (read fully), not in Calvin.
