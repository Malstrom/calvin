id: create_epic
role: |
  Epic creation scenario. Creates a parent issue (epic) from chat context.
  MUST use templates/issue_epic.md as the issue body structure.
  No epic may be created with a blank or free-form body.

steps:
  - name: read_context
    description: |
      Read the chat context and any linked docs, specs or Notion links
      provided by Igor to understand the epic scope.

  - name: draft_epic_body
    description: |
      Draft the epic body using templates/issue_epic.md (in the Calvin repo).
      Fill all relevant fields:
        - Goal: one sentence, concrete and verifiable
        - Why: business or product reason
        - Stack: backend / ios / frontend checkboxes
        - Docs: links to specs, designs, ADRs
        - Scope: explicit in/out of scope
        - Sub-issues: leave empty at creation, filled by decompose scenario
        - Notes: edge cases, risks, dependencies
      Do not invent content. If a field cannot be filled from context, leave
      the placeholder and flag it to Igor in chat.

  - name: confirm_with_igor
    description: |
      Show the draft to Igor in chat. Refine until all required fields
      (Goal, Why, Stack, Scope) are filled and accurate.

  - name: create_issue
    description: |
      Create the issue in the TARGET repo (e.g. synca) using the confirmed
      body. Apply label `epic` automatically.
      Template to use: templates/issue_epic.md (in the Calvin repo).

constraints:
  - MUST use templates/issue_epic.md as body structure. Never create a blank epic.
  - Do not add label `agent` or `task` to an epic.
  - Template to use: templates/issue_epic.md (in the Calvin repo).
  - Target repo: workspace.target in .agent.yml.
