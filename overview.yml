name: calvin
version: 2
status: active

tag_line: "Tutta la complessità in chat. Tutta la densità nel prompt."

purpose: >
  Calvin è un agente CI per sviluppo asincrono. Le epic e le task vengono
  create e raffinate in chat (scenari calvin) finché sono dense e chiare.
  Poi Calvin costruisce un prompt agente minimale ma preciso e lo esegue via
  GitHub Actions e Aider/LLM, aprendo PR. Le decisioni e il contesto duraturo
  vivono in .calvin/ dentro il repo target.

actors:
  igor: crea epic e task in chat, conferma gli scenari, rivede e mergea PR
  perplexity: guida la chat, riempie i template issue_epic.md/issue_task.md,
    scrive il prompt agente agent_prompt.md, propone aggiornamenti a .calvin/
  calvin_cli: entrypoint in bin/calvin, legge issue + .calvin/* + agent_prompt
    e orchestra Aider/LLM + post-processor
  model: esegue la task via Aider/LLM, scrive note Calvin in corpo PR

 decisions:
  framework_name: calvin
  instance_folder: .calvin/
  architecture: zeroth-compliant — estratto da frameworks/calvin in zeroth,
    ora repo dedicata
  entry_point: bin/calvin
  issue_authoring: >
    Tutte le epic e le task vengono scritte e raffinate in chat usando
    issue_epic.md e issue_task.md. Il prompt agente viene scritto come
    commento strutturato (agent_prompt.md) sulla task.
  label_agent_gate: >
    La label agent/agent-aider viene aggiunta solo dopo conferma esplicita
    in chat (Igor conferma che la task e il prompt sono pronti).
  async_prompt_location: >
    Il prompt agente vive in un commento sulla issue (non nel body) e usa
    agent_prompt.md. La issue resta leggibile per gli umani.
  feedback_loop: >
    Il modello scrive note Calvin nel corpo PR (sezione dedicata). Gli
    scenari review_pr e update_context usano queste note per aggiornare
    .calvin/conventions.yml, testing.yml, decisions.yml.
  dependency_resolution: skip e retry nel prossimo ciclo di polling
  execution_visibility: >
    Calvin commenta sull'issue quando parte l'esecuzione, aggiorna lo
    stesso commento finché la PR è aperta/chiusa.
  polling_language: ruby
  engine: Option A (Calvin come prodotto CI, non gem; integra Aider ma non
    dipende da lui in architettura).
  provider_default: mistral/codestral-latest
  provider_fallback:
    - cerebras/gpt-oss-120b
    - mistral/codestral-latest
    - groq/llama-3.3-70b-versatile
    - gemini/gemini-2.5-flash
    - openrouter/deepseek/deepseek-chat-v4-flash:free
    - ollama/qwen2.5:32b
  context_update: >
    Dopo ogni PR agent:review merged, Calvin legge le note dal corpo PR,
    propone micro-PR su .calvin/* via scenario update_context. Igor conferma.

label_lifecycle:
  agent: set dopo conferma in chat — pronta per esecuzione asincrona
  agent:review: set da Calvin quando apre PR
  agent:blocked: set da Calvin quando tutti i provider falliscono
  agent:skip: set da Igor per saltare una issue
  epic: issue madre, decomposta in task
  task: sub-issue eseguibile, riempita con issue_task.md
  backend: stack Rails/backend
  ios: stack iOS/Swift

issue_flow:
  epic: create_epic → decompose → N task issues
  task: refine_task → draft_agent_prompt → label:agent → calvin_cli → PR → review_pr → merge

scenarios:
  - session_start
  - create_epic
  - decompose
  - refine_task
  - draft_agent_prompt
  - calvanize
  - review_pr
  - update_context

derives_from: zeroth
