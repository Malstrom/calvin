name: calvin
version: 2
status: active

tag_line: "All the complexity in chat. All the density in the prompt."

purpose: >
  Calvin is a CI agent for asynchronous development. Epics and tasks are
  created and refined in chat (Calvin scenarios) until they are dense and
  clear. Then Calvin builds a minimal but precise agent prompt and executes
  it via GitHub Actions and Aider/LLM, opening PRs. Long-lived decisions and
  context live in .calvin/ inside the target repo.

actors:
  igor: creates epics and tasks in chat, confirms scenarios, reviews and merges PRs
  perplexity: guides chat, fills issue_epic.md/issue_task.md templates,
    writes the agent prompt (agent_prompt.md), proposes .calvin/ updates
  calvin_cli: entrypoint in bin/calvin, reads issue + .calvin/* + agent_prompt
    and orchestrates Aider/LLM + post-processor
  model: executes the task via Aider/LLM, writes Calvin notes in PR body

decisions:
  framework_name: calvin
  instance_folder: .calvin/
  architecture: zeroth-compliant — extracted from frameworks/calvin in zeroth,
    now a dedicated repo
  entry_point: bin/calvin
  issue_authoring: >
    All epics and tasks are written and refined in chat using issue_epic.md
    and issue_task.md. The agent prompt is written as a structured comment
    (agent_prompt.md) on the task issue.
  label_agent_gate: >
    The agent/agent-aider label is added only after explicit confirmation
    in chat (Igor confirms the task and prompt are ready).
  async_prompt_location: >
    The agent prompt lives in a comment on the issue (not in the body) and
    uses agent_prompt.md. The issue body stays human-friendly.
  feedback_loop: >
    The model writes Calvin notes in the PR body (dedicated section).
    review_pr and update_context scenarios use these notes to update
    .calvin/conventions.yml, testing.yml, decisions.yml.
  dependency_resolution: skip and retry in the next polling cycle
  execution_visibility: >
    Calvin comments on the issue when execution starts, and updates the
    same comment until the PR is open/closed.
  polling_language: ruby
  engine: Option A (Calvin as a CI product, not a gem; integrates Aider but
    is not architecturally tied to it).
  provider_default: mistral/codestral-latest
  provider_fallback:
    - cerebras/gpt-oss-120b
    - mistral/codestral-latest
    - groq/llama-3.3-70b-versatile
    - gemini/gemini-2.5-flash
    - openrouter/deepseek/deepseek-chat-v4-flash:free
    - ollama/qwen2.5:32b
  context_update: >
    After every merged PR with agent:review, Calvin reads notes from the
    PR body and proposes micro-PRs on .calvin/* via update_context.
    Igor confirms before every write.

label_lifecycle:
  agent: set after confirmation in chat — ready for async execution
  agent:review: set by Calvin when a PR is opened
  agent:blocked: set by Calvin when all providers fail
  agent:skip: set by Igor to skip an issue
  epic: parent issue, decomposed into tasks
  task: executable sub-issue, filled using issue_task.md
  backend: Rails/backend stack
  ios: iOS/Swift stack

issue_flow:
  epic: create_epic → decompose → N task issues
  task: refine_task → agent_prompt → label:agent → calvin_cli → PR → review_pr → merge

scenarios:
  - session_start
  - create_epic
  - decompose
  - refine_task
  - agent_prompt
  - calvanize
  - review_pr
  - update_context

derives_from: zeroth
