# Configurazione centralizzata Calvin.
# Caricata una sola volta in boot.rb come Calvin::CONFIG.
# Aggiungere nuovi modelli, path o parametri qui — nessun cambio al codice Ruby necessario.

react:
  max_turns: 30
  grace_turns: 2
  not_found_limit: 3

sampling:
  temperature:
    explore:    0.1   # ReAct loop — leggera variabilità per tool selection
    implement:  0.0   # Codegen puro — massima riproducibilità
    pr_review:  0.0   # PrReviewFlow — deterministico
  max_tokens: 8192

http:
  open_timeout: 15    # secondi — Net::HTTP connect timeout
  read_timeout:  180  # secondi — Net::HTTP read timeout

model:
  default: codestral-latest   # fallback quando CALVIN_MODEL env non è impostata

mistral:
  api_url: https://api.mistral.ai/v1/chat/completions

routing:
  labels:
    explore:   calvin       # label che triggerisce ExploreFlow su una issue
    pr_review: calvin-fix   # label che triggerisce PrReviewFlow su una PR

repo:
  default_branch:    main
  branch_prefix:     auto          # prefisso branch generati da Calvin
  conventions_path:  .calvin/conventions.md
  reports_dir:       .calvin/reports
  stacks:
    known:   [rails, flutter]
    default: rails
  roots:
    rails:   backend/api
    flutter: frontend/mobile

pr_review:
  snippet_context_lines: 20   # righe sopra/sotto la riga del backtrace da mandare al LLM

pricing:
  models:
    codestral-latest:
      input_per_million:  0.30
      output_per_million: 0.90
    mistral-large-latest:
      input_per_million:  2.00
      output_per_million: 6.00

rag:
  # Fase 1 — explore: regole iniettate nel system prompt per orientare l'esplorazione.
  # Tenere basso: il modello usa queste regole per decidere dove leggere, non per scrivere codice.
  # Troppe regole nel system prompt di explore aumentano il rumore e distraggono dalla direzione.
  top_k_explore: 20

  # Fase 2 — implement: regole iniettate nell'user message come ultima sezione (recency bias).
  # La query è costruita dai path del file_plan → regole molto più specifiche al codice da generare.
  # Può essere più alto perché la query è più precisa e il segnale/rumore è migliore.
  top_k_implement: 20

  # Chunk generici — predisposto per source_type futuri (scenari, docs, contratti).
  top_k_context: 5

  embed_model: mistral-embed
  dedup_threshold: 0.92     # soglia similarità per skip all'ingest (non al retrieval)
  query_body_limit: 2000    # caratteri del body inclusi nella query di embedding explore
  similarity_threshold: 0.60  # soglia minima per includere un chunk nel prompt
                               # chunk sotto soglia vengono scartati e loggati
                               # abbassare a 0.50 se troppi chunk vengono filtrati
