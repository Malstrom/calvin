# Configurazione centralizzata Calvin.
# Caricata una sola volta in boot.rb come Calvin::CONFIG.
# Aggiungere nuovi modelli, path o parametri qui — nessun cambio al codice Ruby necessario.

react:
  max_turns: 15
  grace_turns: 2
  not_found_limit: 3

# Clone locale del repo target, già presente nel workflow (actions/checkout path: target).
# Usato dai tool del ReActLoop (read_file/list_dir/grep) e dal Validator.
# Se il path non esiste, Calvin ricade sulla Contents API di GitHub.
workspace:
  target_path: ../target   # relativo a working-directory del job (target/), override: CALVIN_TARGET_PATH
  grep_max_results: 80     # righe massime restituite da un grep — evita di saturare il contesto

# Validation ladder eseguita sui file generati PRIMA di aprire la PR.
#   static — gate senza ambiente Rails: syntax, rubocop, gate strutturali
#   full   — aggiunge zeitwerk:check, db:migrate e i test mirati (richiede Postgres + bundle)
validation:
  level: static
  open_pr_when_red: true    # true: apre la PR con label calvin:red; false: si ferma e commenta l'issue
  red_label: calvin:red
  gates:
    syntax:       true
    rubocop:      true
    structural:   true
    zeitwerk:     true    # solo con level: full
    migrate:      true    # solo con level: full
    focused_test: true    # solo con level: full
    full_test:    false   # suite completa — costa minuti, off per default
  timeout: 600            # secondi per singolo comando shell
  # diff-guard: soglie per rilevare file esistenti riscritti in modo mutilato
  diff_guard:
    max_shrink_ratio: 0.25  # blocca se il file perde più del 25% delle righe senza richiesta esplicita
    ellipsis_markers:
      - "rest of file"
      - "existing code"
      - "unchanged"
      - "as before"
      - "resto del file"
      - "codice esistente"

# Repair loop: quando un gate è rosso, i file coinvolti tornano al modello con l'output dell'errore.
repair:
  max_attempts: 3
  max_cost_usd: 1.00      # budget per run — oltre questa soglia il repair si ferma

# Convenzioni del progetto target: .calvin/conventions.md nel repo target, iniettato
# integralmente nel system prompt. È il posto dove vivono le regole SEMPRE valide di un
# progetto (prima erano scritte dentro config/prompts/rails/explore_system.md, cioè dentro
# Calvin, cioè valide per un solo repo).
conventions:
  max_bytes: 8192   # oltre questa soglia il file viene troncato con un warning

# Feature flag — unico punto di verità (prima il kill-switch era sparso su 3 file).
features:
  generate_tests: false   # TestFlow/TestWriter: riattivare quando la ladder valida i test generati

sampling:
  temperature:
    explore:    0.0   # ReAct loop — deterministico: evita drift architetturale tra run identiche
    implement:  0.0   # Codegen puro — massima riproducibilità
    test:       0.0   # TestWriter — codegen deterministico
    pr_review:  0.0   # PrReviewFlow — deterministico
  max_tokens: 8192

http:
  open_timeout: 15    # secondi — Net::HTTP connect timeout
  read_timeout:  180  # secondi — Net::HTTP read timeout

model:
  default: codestral-latest   # fallback quando CALVIN_MODEL env non è impostata

mistral:
  api_url: https://api.mistral.ai/v1/chat/completions

routing:
  labels:
    explore:   calvin       # label che triggerisce ExploreFlow su una issue

repo:
  default_branch:    main
  branch_prefix:     auto          # prefisso branch generati da Calvin
  reports_dir:       .calvin/reports
  stacks:
    known:   [rails, flutter]
    default: rails

  # LEGACY — da rimuovere quando tutti i target avranno `.calvin/project.yml`.
  # Dove si trova l'applicazione dentro il repo target ora lo dichiara il target stesso, in
  # `.calvin/project.yml` (`app_root`). Questa mappa label→root resta solo come rete per i
  # repo non ancora migrati: viene consultata unicamente se project.yml manca.
  roots:
    rails:   backend/api
    flutter: frontend/mobile

# Path usati da FixturesFetcher, relativi alla radice del repo target.
# LEGACY: FixturesFetcher è orfano (nessun chiamante dopo la rimozione di bin/ingest_fixtures.rb)
# e viene eliminato nello step 2 insieme al resto della vecchia pipeline di ingestion.
project:
  fixtures_dir:     test/fixtures
  test_helper_path: test/test_helper.rb

pricing:
  models:
    codestral-latest:
      input_per_million:  0.30
      output_per_million: 0.90

rag:
  # Repo di cui cercare i chunk nel DB vettoriale — deve corrispondere alla colonna `repo`
  # in calvin_chunks. Vuoto = il repo target del run (GITHUB_REPOSITORY), che è quasi sempre
  # ciò che si vuole. Valorizzarlo solo se i chunk sono indicizzati sotto un altro nome.
  target_repo: ~

  # I top_k restano a 1 di proposito: alzarli è un cambio di comportamento del modello e va
  # deciso con bin/eval.rb (baseline vs candidato), non a intuito. max_rules_bytes è già qui
  # così che alzarli non possa far esplodere il contesto.

  # Fase 1 — explore: regole iniettate nel system prompt per orientare l'esplorazione.
  top_k_explore: 1

  # Fase 2 — implement: regole iniettate nell'user message come ultima sezione (recency bias).
  top_k_implement: 1

  # Fase 3 — test: fixtures + test_helper + rules per il file da testare.
  top_k_test: 1

  # Chunk generici — predisposto per source_type futuri (scenari, docs, contratti).
  top_k_context: 5

  max_rules_bytes: 24576    # budget massimo delle regole iniettate (24 KB) — troncamento ordinato

  embed_model: mistral-embed
  dedup_threshold: 0.92     # soglia similarità per skip all'ingest (non al retrieval)
  query_body_limit: 2000    # caratteri del body inclusi nella query di embedding explore

  similarity_threshold:
    explore:    0.70
    implement:  0.70
    test:       0.70
