# Configurazione centralizzata Calvin.
# Caricata una sola volta in boot.rb come Calvin::CONFIG.
# Aggiungere nuovi modelli, path o parametri qui — nessun cambio al codice Ruby necessario.

react:
  max_turns: 30
  grace_turns: 2
  not_found_limit: 3

sampling:
  temperature:
    explore:    0.1   # ReAct loop — leggera variabilitàper tool selection
    implement:  0.0   # Codegen puro — massima riproducibilità
    pr_fix:     0.0   # PrRubocopFixFlow / PrTestFixFlow — deterministico
  max_tokens: 8192

http:
  open_timeout: 15    # secondi — Net::HTTP connect timeout
  read_timeout:  180  # secondi — Net::HTTP read timeout

model:
  default: codestral-latest   # fallback quando CALVIN_MODEL env non è impostata

repo:
  default_branch:    main
  branch_prefix:     auto          # prefisso branch generati da Calvin
  conventions_path:  .calvin/conventions.md
  reports_dir:       .calvin/reports
  stacks:
    known:   [rails, flutter]
    default: rails
  roots:
    rails:   backend/api
    flutter: frontend/mobile

pricing:
  models:
    codestral-latest:
      input_per_million:  0.30
      output_per_million: 0.90
    mistral-large-latest:
      input_per_million:  2.00
      output_per_million: 6.00
