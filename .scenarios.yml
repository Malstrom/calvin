scenarios:
  - id: session_start
    triggers:
      - first message of the conversation
      - user wants project status or summary
      - user asks what is open or pending
    file: scenarios/session_start.yml

  - id: create_epic
    triggers:
      - user wants to create an epic
      - user says "crea epic", "crea issue madre", "apri epic"
      - triggered after reasoning in chat about a feature
    file: scenarios/create_epic.yml

  - id: decompose
    triggers:
      - user wants to decompose an epic into sub-issues
      - user says "decomponila", "crea sub issue", "decompose"
      - user references an epic issue number to break down
    file: scenarios/decompose.yml

  - id: report_bug
    triggers:
      - user wants to report a bug
      - user says "report bug", "traccia il bug", "crea issue bug", "apri bug"
      - user describes unexpected behaviour in the system
    file: scenarios/report_bug.yml

  - id: refine_task
    triggers:
      - user wants to refine a task issue
      - user says "raffina la task", "aggiungi dettagli", "completa la descrizione"
      - user references a task issue number to deepen
      - user references a bug issue number to deepen
    file: scenarios/refine_task.yml

  - id: agent_prompt
    triggers:
      - user wants to prepare the agent prompt for async execution
      - user says "scrivi il prompt", "prepara per il modello", "prompt agente"
      - user references a task issue number ready for execution
    file: scenarios/agent_prompt.yml

  - id: calvanize
    triggers:
      - user wants to bootstrap Calvin on a new repo
      - user says "calvanize", "inizializza calvin", "bootstrap calvin"
      - .calvin/ does not exist on target repo
    file: scenarios/calvanize.yml

  - id: review_pr
    triggers:
      - user wants to review a PR
      - user references a PR number
      - user says "review", "guarda la PR", "controlla"
    file: scenarios/review_pr.yml

  - id: update_context
    triggers:
      - user merged a PR and wants to update context
      - user wants to record a decision
      - user says "aggiorna contesto", "salva decisione"
      - called from review_pr after Calvin notes confirmed
    file: scenarios/update_context.yml
