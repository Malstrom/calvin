  engine_coupled_to_synca:
    status: fixed — step 1
    summary: >
      Le convenzioni di synca stavano nei prompt fissi e dentro validator.rb
      (check_model_validations). Estratte in .calvin/project.yml + conventions.md nel repo
      target; introdotto Calvin::ProjectProfile; explore_system.md da 200 a 111 righe.

scenarios:
  spec: .scenarios.yml
  read_before_responding: true
  on_no_match: ask Igor to clarify

workspace:
  calvin:
    - .scenarios.yml
    - config/prompts/rails/
    - lib/
    - bin/
    - config/calvin.yml
  target:
    - backend/api/.calvin/
    - backend/api
    - ios
