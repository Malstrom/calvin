language:
  chat: italian
  files: english
  filenames: english

tool_approval:
  create_branch: false
  push_files: false
  create_pr: false
  create_issue: false
  create_sub_issue: false
  update_issue: false
  merge_to_main: false
  delete_file: true
  destructive_ops: true

work_rules:
  push_directly_to_main: true
  create_pr_only_if_igor_asks: true
  never_modify_without_explicit_confirmation: true
  never_merge_pr_without_igor_confirmation: true

role: dev assistant for Calvin — works in chat with Igor to write and refine epics and tasks for synca, improve Calvin itself (prompt engineering, Ruby fixes, architecture), and debug failures visible in synca/.calvin/reports/ or CI runs.

architecture:
  entry_point: bin/calvin.rb
  routing: ModeRouter.for_labels(labels) → mode symbol
  separation_of_concerns: >
    Calvin è generico. Tutto ciò che è specifico di un progetto vive in .calvin/ nel repo
    target: project.yml (app_root, comandi test, gate, forbidden_patterns) e conventions.md
    (regole sempre attive, iniettate nel system prompt). Una regola di progetto non va MAI
    scritta in config/prompts/ — quello è il motore, e vale per tutti i target.
  project_profile:
    class: Calvin::ProjectProfile
    reads: [.calvin/project.yml, .calvin/conventions.md]
    loaded_from: workspace sulla RADICE del repo (app_root è ciò che si sta scoprendo)
    fallback: default Rails generici + legacy repo.roots per label se project.yml manca
  system_message_layering:
    - "[system 0] config/prompts/{stack}/*_system.md — comportamento agentico, fisso"
    - "[system 1] .calvin/conventions.md — regole sempre attive del target"
    - "[system 2] chunk RAG — contesto recuperato per similarity"
    - "[user] task + osservazioni"
  modes:
    explore_issue: label calvin on synca issue
    unknown: exit(1)
  explore_flow:
    steps:
      - ContextBuilder
      - ContextRetriever
      - ReActLoop
      - FileParser
      - Validator + RepairLoop
      - CommitAndPr
      - PostSteps
    react_loop:
      phase_1: "explore_system.md — multi-turn, tools: read_file / list_dir / grep / done"
      phase_2: "implement_system.md — single call, FILE: blocks + PR_BODY"
      reads_from: RepoReader — clone locale (Workspace) con fallback Contents API
    validation:
      ladder: [syntax, rubocop, structural, zeitwerk, migrate, focused_test, full_test]
      levels:
        static: syntax + rubocop + structural — nessun ambiente Rails
        full: aggiunge zeitwerk / migrate / focused_test — richiede Postgres e bundle del target
      structural_gates:
        - diff-guard — marker di elisione, definizioni scomparse, shrink oltre soglia
        - file_plan vs output — nessun FILE block fuori piano, nessun path pianificato mancante
        - timestamp migration maggiore dell'ultima esistente
        - ogni route nuova ha un controller esistente o nel piano
        - forbidden_patterns dichiarati dal target in .calvin/project.yml
      rubocop_gate: solo offese NON correggibili — le correggibili le sistema RubocopAutocorrect
      on_red: RepairLoop (repair.max_attempts) → se resta rosso, PR con label calvin:red
    post_steps:
      - RubocopAutocorrect
      - RunReporter
  flow_result:
    required_fields: [files, branch, status]
    optional_fields: [usage, temperature, pr_url]
    flow_meta: free hash — access via result.meta(:key), never hash[:key]
  model: codestral-latest
  config_source: config/calvin.yml

repo_structure:
  bin/calvin.rb: entry point — ModeRouter routing, case/in on mode, PostSteps.run
  bin/eval.rb: eval harness — pass-rate su issue congelate, sempre in dry run
  lib/boot.rb: requires, Calvin::CONFIG, logging, REPO_ROOTS, Calvin.feature?, Calvin.dry_run?
  lib/project_profile.rb: Calvin::ProjectProfile — .calvin/project.yml + conventions.md del target
  lib/workspace.rb: I/O sul clone locale del target (read/list/grep/write), path sandboxed
  lib/repo_reader.rb: adapter di lettura — clone locale con fallback Contents API
  lib/validator.rb: validation ladder + gate strutturali — ritorna Validator::Result
  lib/repair_loop.rb: rimanda gate rosso + output reale al modello, max_attempts da config
  lib/flow_result.rb: Calvin::FlowResult
  lib/mode_router.rb: ModeRouter.for_labels(labels) → mode symbol
  lib/post_steps.rb: Calvin::PostSteps.run
  lib/react_loop.rb: ReActLoop — multi-turn explore + single implement call
  lib/explore_flow.rb: ExploreFlow orchestrator
  lib/context_builder.rb: builds issue prompt string
  lib/file_parser.rb: "parses FILE: blocks from LLM output"
  lib/commit_and_pr.rb: commits parsed files + opens PR on synca
  lib/mistral_client.rb: HTTP client for Mistral API
  lib/github_client.rb: GitHub API wrapper
  lib/rubocop_runner.rb: core rubocop logic, fetches .rubocop.yml from target repo
  lib/rubocop_autocorrect.rb: thin wrapper on RubocopRunner
  lib/run_reporter.rb: appends run stats to runs.csv + runs.md
  lib/pr_body_builder.rb: extracts PR_BODY_START…PR_BODY_END from LLM output
  config/calvin.yml: ALL runtime constants
  config/prompts/rails/explore_system.md: system prompt PHASE 1 — generico, senza dominio
  config/prompts/rails/implement_system.md: system prompt PHASE 2 — generico, senza dominio
  templates/calvin/: scaffold di .calvin/ da copiare nel repo target
  docs/targeting-a-new-repo.md: come collegare Calvin a un progetto Rails

prompt_files:
  explore_system.md:
    path: config/prompts/rails/explore_system.md
    used_in: ReActLoop PHASE 1
    critical: JSON format for tool calls — parser expects line starting with "{"
  implement_system.md:
    path: config/prompts/rails/implement_system.md
    used_in: ReActLoop PHASE 2
    critical:
      - rule order matters — Mistral weights end of prompt (recency bias)
      - >
        NON contiene regole di dominio: sono uscite nello step 1 e vivono in
        .calvin/conventions.md nel repo target. Non reintrodurle qui.

target_repo:
  note: >
    Il target di riferimento oggi è synca, ma Calvin non ne dipende più: layout e convenzioni
    arrivano da .calvin/ nel repo target. synca non ha ancora .calvin/project.yml e gira sul
    fallback legacy repo.roots.
  name: synca
  owner: Malstrom
  calvin_files:
    - backend/api/.calvin/reports/runs.csv
    - backend/api/.calvin/reports/runs.md
  test_structure:
    - test/models/
    - test/controllers/
    - test/services/
    - test/contracts/
  label: calvin

working_principles:
  - push directly to main unless Igor explicitly asks for a PR
  - always read the relevant file before modifying it (get SHA for updates)
  - when fixing a prompt, critical rules go LAST (recency bias)
  - if a rule can be verified deterministically, put it in Validator — not in a prompt
  - a project rule NEVER goes in config/prompts/ — it goes in .calvin/ on the target repo
  - config/prompts/ describes how to be an agent, never how one specific app is built
  - every pure function gets a unit test in test/ (bundle exec rake test must stay green)
  - prompt/config changes that affect model behaviour go through bin/eval.rb, not intuition
  - CSV rows must always be padded to CSV_HEADER.size columns
  - when Calvin generates model tests in a PR, delete them and fix .calvin/conventions.md on the target
  - never merge PRs without Igor confirmation
  - routing lives in ModeRouter — never add label checks in bin/calvin.rb
  - all configuration constants live in calvin.yml — never hardcode values in Ruby
  - flow results use Calvin::FlowResult — access optional fields via result.meta(:key)

