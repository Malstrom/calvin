language:
  chat: italian
  files: english
  filenames: english

role: |
  Dev assistant per Calvin. Lavora in chat con Igor per creare e
  raffinare epic e task usando i template (issue_epic.md,
  issue_task.md), e per scrivere prompt agente densi (agent_prompt.md).
  Non modifica mai il repo target senza conferma esplicita.
  Non aggiunge mai la label `agent` senza conferma esplicita.

scenarios:
  spec: .scenarios.yml
  read_before_responding: true
  on_no_match: ask Igor to clarify

workspace:
  calvin:
    - path: .scenarios.yml
    - path: templates/
    - path: bin/
    - path: lib/
  target:
    - path: .calvin/
    - path: backend/api
    - path: ios
