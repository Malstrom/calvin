name: Calvin engine

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      target_repo:
        required: true
        type: string
      aider_mode:
        required: false
        type: boolean
        default: false
    secrets:
      SYNCA_TOKEN:
        required: true
      MISTRAL_API_KEY:
        required: false

jobs:
  calvin:
    runs-on: ubuntu-latest
    steps:
      # 1. Clona calvin (scripts + lib)
      - name: Checkout calvin
        uses: actions/checkout@v4
        with:
          repository: Malstrom/calvin
          token: ${{ secrets.SYNCA_TOKEN }}
          path: calvin

      # 2. Clona il repo target
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ secrets.SYNCA_TOKEN }}
          path: target

      # 3. Git identity (necessaria per i commit di Aider)
      - name: Configure git identity
        run: |
          git config --global user.email "calvin@synca.app"
          git config --global user.name "Calvin"

      # 4. Ruby + gem di Calvin (octokit, dry-monads, rubocop)
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Ruby dependencies (calvin)
        run: bundle install
        working-directory: calvin/bin

      # 5. Python + Aider (solo modalità aider)
      - name: Install Aider
        if: ${{ inputs.aider_mode }}
        run: pip install --quiet aider-chat

      # 6. Esegue Calvin
      - name: Run Calvin
        run: bundle exec ruby $GITHUB_WORKSPACE/calvin/bin/calvin.rb
        working-directory: target
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/calvin/bin/Gemfile
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GITHUB_REPOSITORY: ${{ inputs.target_repo }}
          GITHUB_TOKEN: ${{ secrets.SYNCA_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CALVIN_MODEL: codestral-latest
