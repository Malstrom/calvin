name: Calvin engine

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      target_repo:
        required: true
        type: string
    secrets:
      SYNCA_TOKEN:
        required: true
      MISTRAL_API_KEY:
        required: false

jobs:
  calvin:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Clona calvin (scripts + lib)
      - name: Checkout calvin
        uses: actions/checkout@v4
        with:
          repository: Malstrom/calvin
          token: ${{ secrets.SYNCA_TOKEN }}
          path: calvin

      # 2. Clona il repo target
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ secrets.SYNCA_TOKEN }}
          path: target

      # 3. Git identity
      - name: Configure git identity
        run: |
          git config --global user.email "calvin@synca.app"
          git config --global user.name "Calvin"

      # 4. Ruby + gem di Calvin
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Ruby dependencies (calvin)
        run: bundle install
        working-directory: calvin/bin

      # 5. Ruby + gem del target (synca Rails app) — con cache
      - name: Set up Ruby for target repo
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: target/backend/api/.ruby-version
          bundler-cache: true
          working-directory: target/backend/api

      # 6. Prepara il database test
      - name: Setup test database
        run: bundle exec rails db:create db:migrate
        working-directory: target/backend/api
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/synca_test

      # 7. Esegue Calvin
      #    CALVIN_RAILS_ROOT: path assoluto della dir Rails di synca nel runner.
      #    TestRunner e TestFixLoop lo usano per Dir.chdir prima di rails test.
      - name: Run Calvin
        run: bundle exec ruby $GITHUB_WORKSPACE/calvin/bin/calvin.rb
        working-directory: target
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/calvin/bin/Gemfile
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GITHUB_REPOSITORY: ${{ inputs.target_repo }}
          GITHUB_TOKEN: ${{ secrets.SYNCA_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CALVIN_MODEL: codestral-latest
          CALVIN_RAILS_ROOT: ${{ github.workspace }}/target/backend/api
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/synca_test
          RAILS_ENV: test
