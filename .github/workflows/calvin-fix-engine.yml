name: Calvin Fix Engine

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      pr_branch:
        required: true
        type: string
      target_repo:
        required: true
        type: string
    secrets:
      SYNCA_TOKEN:
        required: true
      MISTRAL_API_KEY:
        required: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calvin
        uses: actions/checkout@v4
        with:
          repository: Malstrom/calvin
          token: ${{ secrets.SYNCA_TOKEN }}
          path: calvin

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ secrets.SYNCA_TOKEN }}
          ref: ${{ inputs.pr_branch }}
          path: target

      - name: Configure git identity
        run: |
          git config --global user.email "calvin@synca.app"
          git config --global user.name "Calvin"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Ruby dependencies
        run: bundle install
        working-directory: calvin/bin

      - name: Download test output artifact
        uses: actions/download-artifact@v4
        with:
          name: test-output
          path: /tmp
          github-token: ${{ secrets.SYNCA_TOKEN }}
          repository: ${{ inputs.target_repo }}

      - name: Run Calvin Fix
        run: bundle exec ruby $GITHUB_WORKSPACE/calvin/bin/calvin.rb
        working-directory: target
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/calvin/bin/Gemfile
          GITHUB_REPOSITORY: ${{ inputs.target_repo }}
          GITHUB_TOKEN: ${{ secrets.SYNCA_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CALVIN_MODEL: codestral-latest
          CALVIN_FIX_MODE: "true"
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_BRANCH: ${{ inputs.pr_branch }}
          TEST_OUTPUT_PATH: /tmp/test-output.txt
