root: calvin/

files:
  .agent.yml:
    role: operational manifest per l'assistente in chat
    written_by: Igor + Perplexity
    updated_by: manual quando il ruolo di Calvin evolve

  .scenarios.yml:
    role: indice scenari — mappa i trigger ai file in scenarios/
    written_by: Perplexity
    updated_by: quando gli scenari vengono aggiunti o rinominati

  overview.yml:
    role: decisioni, label lifecycle, attori, issue_flow
    written_by: Perplexity
    updated_by: quando decisioni e flusso cambiano

  structure.yml:
    role: questo file — mappa di tutti i file del framework con ruoli
    written_by: Perplexity
    updated_by: quando file o cartelle cambiano

  README.md:
    role: human entry point — quick start, contesto Asimov/zeroth e file map
    written_by: Igor + Perplexity
    updated_by: quando struttura o flusso cambiano

scenarios/:
  session_start.yml:
    role: orienta la sessione, mostra lavoro aperto e scenari disponibili

  create_epic.yml:
    role: crea issue madre (epic) da contesto chat, linka docs/ paragrafi

  decompose.yml:
    role: legge l'epic + docs/ ed espande in sub-issue atomiche usando issue_task.md

  refine_task.yml:
    role: prende una task esistente e la porta al livello di dettaglio richiesto,
      leggendo .calvin/* e porzioni mirate di repo

  draft_agent_prompt.yml:
    role: legge epic, task e .calvin/* e scrive il prompt agente usando agent_prompt.md

  calvanize.yml:
    role: bootstrap di .calvin/ su un nuovo repo target

  review_pr.yml:
    role: rivede una PR, legge note Calvin e propone aggiornamenti a .calvin/*

  update_context.yml:
    role: applica gli aggiornamenti confermati a .calvin/conventions.yml,
      testing.yml, decisions.yml dopo il merge

templates/:
  issue_epic.md:
    role: template corpo per epic
    fields: [Goal, Why, Stack, Docs, Scope, Sub-issues, Notes]

  issue_task.md:
    role: template corpo per task
    fields: [Goal, Parent, Stack, DB Changes, Endpoint, Entry points,
      Acceptance criteria, Dependencies, Notes, Examples]

  agent_prompt.md:
    role: template commento per prompt agente denso
    fields: [Goal, Entry points, Constraints, Tests, Depends on, Context, Examples]
    note: il modello legge principalmente questo commento + subset di .calvin/*

bin/:
  calvin:
    role: entry point CLI per il workflow GitHub Actions
    run: legge numero issue, label, path .calvin/, costruisce contesto e prompt,
      invoca Aider/LLM, esegue post-processor, apre PR

lib/calvin/:
  context_builder.rb:
    role: carica i file .calvin/* rilevanti e schema/logica necessaria

  prompt_builder.rb:
    role: assembla il prompt agente da issue + contesto + agent_prompt.md

  post_processor.rb:
    role: sistema le migration con filename `[timestamp]` e altri fix post-commit

  ci_runner.rb:
    role: orchestration generale: legge issue, chiama builder, Aider/LLM,
      gestisce fallback provider, aggiorna label e commenti

instance_layout:
  note: file per-repo creati dallo scenario calvanize
  .calvin/stack.yml: tech stack + librerie chiave
  .calvin/conventions.yml: naming, pattern, do-not-touch rules
  .calvin/testing.yml: strategia di test e regole di coverage
  .calvin/decisions.yml: decisioni architetturali append-only
  .calvin/schema.yml: schema logico dei model rilevanti per i prompt
