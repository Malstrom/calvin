root: calvin/

files:
  .agent.yml:
    role: operational manifest for the chat assistant
    written_by: Igor + Perplexity
    updated_by: manual when Calvin's role evolves

  .scenarios.yml:
    role: scenario index — maps triggers to files in scenarios/
    written_by: Perplexity
    updated_by: when scenarios are added or renamed

  overview.yml:
    role: decisions, label lifecycle, actors, issue_flow
    written_by: Perplexity
    updated_by: when decisions or flow change

  structure.yml:
    role: this file — map of all framework files with roles
    written_by: Perplexity
    updated_by: when files or folders change

  README.md:
    role: human entry point — quick start, Asimov/zeroth context and file map
    written_by: Igor + Perplexity
    updated_by: when structure or flow change

scenarios/:
  session_start.yml:
    role: orients the session, shows open work and available scenarios

  create_epic.yml:
    role: creates parent issues (epics) from chat context, links docs/ paragraphs

  decompose.yml:
    role: reads the epic + docs/ and expands into atomic sub-issues using issue_task.md

  refine_task.yml:
    role: takes an existing task and brings it to the required level of detail,
      reading .calvin/* and targeted parts of the repo

  agent_prompt.yml:
    role: reads epic, task and .calvin/* and writes the agent prompt using agent_prompt.md

  calvanize.yml:
    role: bootstraps .calvin/ on a new target repo

  review_pr.yml:
    role: reviews a PR, reads Calvin notes and proposes .calvin/* updates

  update_context.yml:
    role: applies confirmed updates to .calvin/conventions.yml,
      testing.yml, decisions.yml after merge

templates/:
  issue_epic.md:
    role: body template for epics
    fields: [Goal, Why, Stack, Docs, Scope, Sub-issues, Notes]

  issue_task.md:
    role: body template for tasks
    fields: [Goal, Parent, Stack, DB Changes, Endpoint, Entry points,
      Acceptance criteria, Dependencies, Notes, Examples]

  agent_prompt.md:
    role: comment template for a dense agent prompt
    fields: [Goal, Entry points, Constraints, Tests, Depends on, Context, Examples]
    note: the model primarily reads this comment + subset of .calvin/*

bin/:
  calvin:
    role: CLI entry point for the GitHub Actions workflow
    run: reads issue number, label, .calvin/ path, builds context and prompt,
      invokes Aider/LLM, runs post-processor, opens PRs

lib/calvin/:
  context_builder.rb:
    role: loads relevant .calvin/* files and necessary schema/logic

  prompt_builder.rb:
    role: assembles the agent prompt from issue + context + agent_prompt.md

  post_processor.rb:
    role: fixes migrations with `[timestamp]` filenames and other post-commit fixes

  ci_runner.rb:
    role: overall orchestration — reads issue, calls builders, Aider/LLM,
      handles provider fallback, updates labels and comments

instance_layout:
  note: per-repo files created by the calvanize scenario
  .calvin/stack.yml: tech stack + key libraries
  .calvin/conventions.yml: naming, patterns, do-not-touch rules
  .calvin/testing.yml: test strategy and coverage rules
  .calvin/decisions.yml: append-only architectural decisions
  .calvin/schema.yml: logical schema of models relevant for prompts
